name: APK Factory 2.6.1 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        shell: bash
        run: |
          if [ -f ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ]; then chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace; else gradle assembleDebug --stacktrace; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-factory-output-${{ github.run_id }}
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
